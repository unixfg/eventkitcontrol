name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  shell:
    name: Repository policy checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check shell syntax
        run: bash -n Scripts/*.sh

      - name: Run ShellCheck
        run: shellcheck Scripts/*.sh

      - name: Test Python release helpers
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover -s Tests/ReleaseNotes -p '*_tests.py'
          python3 -m unittest discover -s Tests/Workflow -p '*_tests.py'

      - name: Reject retired upstream identity
        run: |
          set -Eeuo pipefail
          test ! -e build.sh
          legacy_name='e''kctl'
          if git ls-files | grep -iF -- "$legacy_name"; then
            echo "error: tracked paths must use the eventkitcontrol identity" >&2
            exit 1
          fi
          if git grep -n -i "$legacy_name"; then
            echo "error: tracked content must not use the retired upstream identity" >&2
            exit 1
          fi

  swift:
    name: Swift 6 / macOS 26 / ARM64
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report and validate toolchain
        run: |
          set -Eeuo pipefail
          xcodebuild -version
          swift --version
          test "$(uname -m)" = arm64
          XCODE_VERSION="$(xcodebuild -version | awk 'NR == 1 && $1 == "Xcode" { print $2 }')"
          XCODE_MAJOR="${XCODE_VERSION%%.*}"
          [[ "$XCODE_MAJOR" =~ ^[0-9]+$ ]] && (( XCODE_MAJOR >= 26 ))
          [[ "$(swift --version)" == *"Swift version 6."* ]]

      - name: Validate package and privacy metadata
        run: |
          set -Eeuo pipefail
          ./Scripts/validate-lockfile.sh
          swift package dump-package >/dev/null
          plutil -lint Info.plist eventkitcontrol.entitlements

      - name: Test temporary keychain search-list lifecycle
        run: |
          set -Eeuo pipefail
          TEST_KEYCHAIN="$RUNNER_TEMP/eventkitcontrol-ci.keychain-db"
          SEARCH_LIST_BACKUP="$RUNNER_TEMP/eventkitcontrol-ci-keychains.json"

          cleanup() {
            ORIGINAL_RC=$?
            set +e
            CLEANUP_RC=0
            if [[ -f "$SEARCH_LIST_BACKUP" && ! -L "$SEARCH_LIST_BACKUP" ]]; then
              python3 Scripts/manage_keychain_search_list.py restore \
                --backup "$SEARCH_LIST_BACKUP" \
                --keychain "$TEST_KEYCHAIN" \
                || CLEANUP_RC=1
            fi
            if [[ -e "$TEST_KEYCHAIN" || -L "$TEST_KEYCHAIN" ]]; then
              security delete-keychain "$TEST_KEYCHAIN" >/dev/null 2>&1 \
                || CLEANUP_RC=1
            fi
            rm -f "$SEARCH_LIST_BACKUP" || CLEANUP_RC=1
            if [[ "$ORIGINAL_RC" -ne 0 ]]; then
              exit "$ORIGINAL_RC"
            fi
            exit "$CLEANUP_RC"
          }
          trap cleanup EXIT

          for test_path in "$TEST_KEYCHAIN" "$SEARCH_LIST_BACKUP"; do
            [[ ! -e "$test_path" && ! -L "$test_path" ]] \
              || { echo "error: test path already exists: $test_path" >&2; exit 1; }
          done

          python3 Scripts/manage_keychain_search_list.py snapshot \
            --output "$SEARCH_LIST_BACKUP" \
            --keychain "$TEST_KEYCHAIN"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$TEST_KEYCHAIN"
          python3 Scripts/manage_keychain_search_list.py prepend \
            --backup "$SEARCH_LIST_BACKUP" \
            --keychain "$TEST_KEYCHAIN"
          python3 Scripts/manage_keychain_search_list.py restore \
            --backup "$SEARCH_LIST_BACKUP" \
            --keychain "$TEST_KEYCHAIN"
          security delete-keychain "$TEST_KEYCHAIN"
          rm -f "$SEARCH_LIST_BACKUP"
          trap - EXIT

      - name: Build executable from locked dependencies
        run: |
          swift build \
            --product eventkitcontrol \
            --arch arm64 \
            --disable-automatic-resolution

      - name: Run tests from locked dependencies
        run: swift test --disable-automatic-resolution

      - name: Build and validate release-mode snapshot binary
        run: ./Scripts/build-artifact.sh --output-dir dist

      - name: Build and validate unsigned product archive structure
        run: |
          ./Scripts/build-package.sh \
            --signing-mode unsigned \
            --output dist/eventkitcontrol-ci-unsigned.pkg \
            dist/eventkitcontrol

      - name: Verify dependency lock is unchanged
        run: git diff --exit-code -- Package.resolved

      - name: Package main snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SNAPSHOT_ARCHIVE: eventkitcontrol-${{ github.sha }}-macos-arm64.tar.gz
        run: |
          set -Eeuo pipefail
          COPYFILE_DISABLE=1 tar -C dist -czf "$SNAPSHOT_ARCHIVE" eventkitcontrol
          shasum -a 256 "$SNAPSHOT_ARCHIVE"

      - name: Upload main snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: eventkitcontrol-${{ github.sha }}-macos-arm64.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14
